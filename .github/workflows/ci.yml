name: Java CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # needed later for AI review comments

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Check code formatting
        run: mvn -B --no-transfer-progress spotless:check

      - name: Build project
        run: mvn -B --no-transfer-progress clean verify

      - name: SonarCloud analysis
        run: |
          mvn -B --no-transfer-progress sonar:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}