name: Java CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # needed later for AI review comments

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build project
        run: mvn -B clean verify