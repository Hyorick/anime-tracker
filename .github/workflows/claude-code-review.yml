name: Claude Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Perform a code review of this pull request.

            Review the changes against the project instructions in CLAUDE.md.

            Focus on concrete, actionable issues involving:

            - Bugs and incorrect behavior
            - Security vulnerabilities
            - Data integrity
            - Spring Boot usage
            - JPA and database behavior
            - Transaction boundaries
            - REST API behavior
            - Performance
            - Maintainability
            - Missing or inadequate tests

            The project already uses Spotless and SonarCloud.

            Do not report:
            - Formatting issues handled by Spotless
            - Trivial style preferences
            - Simple findings that SonarCloud already handles
            - Purely speculative problems without evidence

            Prioritize correctness and security over style.

            For every finding:
            - Assign CRITICAL, HIGH, MEDIUM, or LOW severity.
            - Explain the problem clearly.
            - Explain why it matters.
            - Suggest a concrete fix when appropriate.

            Only report issues that are genuinely worth addressing.

            This is a REVIEW ONLY.

            Do not modify files.
            Do not create commits.
            Do not push changes.

            If there are no significant issues, explicitly state that the pull request looks good.

            After completing the review, POST THE REVIEW RESULT AS A COMMENT ON THIS PULL REQUEST.
            
            Use: 
              gh pr comment ${{ github.event.pull_request.number }}
            
            The comment should contain:
            - A concise summary of the review.
            - Each finding with its severity.
            - The affected file/line when applicable.
            - A concrete explanation and recommendation.
            - A clear statement if no significant issues were found.
            
            Do not only return the review in your Claude response.
            You MUST publish the final review as a GitHub pull request comment.

          claude_args: | 
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"