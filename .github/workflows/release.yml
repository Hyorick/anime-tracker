name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Read Maven project version
        id: version
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Maven project version: $VERSION"

      - name: Validate release version
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            echo "ERROR: Cannot create a release from a SNAPSHOT version: $VERSION"
            exit 1
          fi

      - name: Check if Git tag already exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Git tag $TAG already exists."
            exit 1
          fi

      - name: Create Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes